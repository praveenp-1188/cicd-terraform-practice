name: Terraform Plan

on:
  pull_request:
    paths:
      - 'terraform/**'
      - 'app/**'
      - '.github/workflows/terraform-plan.yml'
    branches:
      - main

permissions:
  pull-requests: write
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    
    env:
      # Azure authentication
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      
      # Terraform settings
      TF_IN_AUTOMATION: true
      TF_VERSION: 1.5.0
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ./terraform
        continue-on-error: true
      
      - name: Terraform Init
        run: terraform init -input=false
        working-directory: ./terraform
      
      - name: Terraform Validate
        run: terraform validate
        working-directory: ./terraform
      
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -out=tfplan -input=false
          terraform show -json tfplan > tfplan.json
        working-directory: ./terraform
      
      - name: Comment Plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('./terraform/tfplan.json', 'utf8');
            const planJson = JSON.parse(plan);
            
            const resourceChanges = planJson.resource_changes || [];
            const changes = {
              add: resourceChanges.filter(r => r.change.actions.includes('create')).length,
              modify: resourceChanges.filter(r => r.change.actions.includes('update')).length,
              delete: resourceChanges.filter(r => r.change.actions.includes('delete')).length,
            };
            
            const comment = `## 📋 Terraform Plan
            
- ✅ **Added**: ${changes.add} resources
- 🔄 **Modified**: ${changes.modify} resources
- ❌ **Deleted**: ${changes.delete} resources

**Action Required**: Review the changes above before merging.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  lint-check:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
      
      - name: Terraform Format
        run: terraform fmt -check -recursive || true
        working-directory: ./terraform
